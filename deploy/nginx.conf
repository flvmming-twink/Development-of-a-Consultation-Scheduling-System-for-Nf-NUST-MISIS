# Replace consultations.example.org and certificate paths before use.
server {
    listen 80;
    server_name consultations.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name consultations.example.org;
    ssl_certificate /etc/ssl/consultations/fullchain.pem;
    ssl_certificate_key /etc/ssl/consultations/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
